# Gradle JVM heap for standalone RGRemote builds.
# org.sqlite.tmpdir: Room's SQLite verifier and sqlite-jdbc extract a native DLL to the temp dir
# at KSP time. C:\WINDOWS\TEMP (the java.io.tmpdir default from the system TMP/TEMP env vars)
# intermittently fails Room's isDirectory/canRead/canWrite check, aborting :app:kspDebugKotlin
# with "temp dir needs to be a directory, must be readable, writable and allow executables".
# Point sqlite at the Gradle daemon's own working directory (the daemon home under GRADLE_USER_HOME,
# always existing and writable for the current user) instead of the flaky system temp dir.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Dorg.sqlite.tmpdir=.
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true

